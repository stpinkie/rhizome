services:
  # ─────────────────────────────────────────────
  # Rhizome Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm rhizome-agent -m "Hello"
  # ─────────────────────────────────────────────
  rhizome-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: rhizome-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.rhizome/config.json:ro
      - rhizome-workspace:/root/.rhizome/workspace
      - rhizome-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["rhizome", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Rhizome Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  rhizome-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: rhizome-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.rhizome/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - rhizome-workspace:/root/.rhizome/workspace
      # NPM cache for faster MCP server installs
      - rhizome-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  rhizome-workspace:
  rhizome-npm-cache: # Cache npm packages to speed up MCP server installations
