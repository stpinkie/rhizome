services:
  # ─────────────────────────────────────────────
  # Rhizome Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm rhizome-agent -m "Hello"
  # ─────────────────────────────────────────────
  rhizome-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/sipeed/rhizome:latest
    container_name: rhizome-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.rhizome
    entrypoint: ["rhizome", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Rhizome Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  rhizome-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: docker.io/sipeed/rhizome:latest
    container_name: rhizome-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.rhizome

  # ─────────────────────────────────────────────
  # Rhizome Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  rhizome-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: docker.io/sipeed/rhizome:launcher
    container_name: rhizome-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - RHIZOME_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- RHIZOME_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.rhizome
