name: Release

on:
  # Fires on manually pushed v* tags. Tags created by the Create Tag workflow
  # arrive via an explicit workflow_dispatch instead — GITHUB_TOKEN pushes do
  # not trigger push events.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.9.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false
      draft:
        description: "Create as draft"
        required: false
        type: boolean
        default: false
jobs:
  release:
    name: GoReleaser Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Resolve release tag
        id: release_tag
        run: echo "value=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/${{ steps.release_tag.outputs.value }}" --silent 2>/dev/null; then
            echo "::error::Tag '${{ steps.release_tag.outputs.value }}' does not exist. Create it first using the 'Create Tag' workflow."
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release_tag.outputs.value }}

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub credentials
        id: dockerhub
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check module catalog signing key
        id: catalog_key
        run: |
          if [ -n "${{ secrets.MODULE_CATALOG_SIGNING_KEY }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Strip Docker Hub targets when credentials are absent
        if: steps.dockerhub.outputs.available != 'true'
        run: |
          # Remove docker.io/ image lines so GoReleaser only pushes to GHCR.
          sed -i '/docker\.io/d' .goreleaser.yaml
          # GoReleaser refuses to run on a dirty tree; hide the local edit.
          git update-index --assume-unchanged .goreleaser.yaml
          echo "Docker Hub credentials not configured; stripped docker.io targets."

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          # Disable the local cache: a partially-extracted NDK entry breaks
          # the toolchain (missing bin/clang) and persists across runs.
          local-cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pinned minor — bump deliberately after a release-smoke run; a
          # floating ~> v2 lets an untested GoReleaser break release day.
          version: ~> v2.18
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          INCLUDE_ANDROID_BUNDLE: "true"
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOST: linux-x86_64
          # NDK r26+ dropped API <= 20; override in case an older tag is built.
          ANDROID_API: "21"
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # Signs the embedded module catalog and attaches catalog.json +
      # catalog.json.sig to the release — the trust root for the opt-in
      # remote module index. Skipped when the secret is absent (same gate
      # pattern as Docker Hub).
      - name: Sign and upload module catalog
        if: steps.catalog_key.outputs.available == 'true'
        env:
          MODULE_CATALOG_SIGNING_KEY: ${{ secrets.MODULE_CATALOG_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run -tags goolm,stdjson ./cmd/rhizome module catalog \
            --out catalog.json --sign-with-env MODULE_CATALOG_SIGNING_KEY
          gh release upload "${{ steps.release_tag.outputs.value }}" \
            catalog.json catalog.json.sig --clobber

      # Dispatch-only: on tag-push runs the prerelease flag comes from
      # goreleaser's `prerelease: auto` (semver suffix detection).
      - name: Apply release flags
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.release_tag.outputs.value }}" \
            --draft=${{ inputs.draft }} \
            --prerelease=${{ inputs.prerelease }}


