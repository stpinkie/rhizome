name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Golangci Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          args: --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: |
          govulncheck -C . -format text ./...
          EXIT=$?
          if [ $EXIT -eq 3 ]; then
            # Exit code 3 = vulnerabilities found. Re-run to check if all
            # findings are unfixable upstream issues (no patched version).
            OUTPUT=$(govulncheck -C . -format text ./... 2>&1 || true)
            # GO-2024-3218 in go-libp2p-kad-dht has no fix (Fixed in: N/A)
            if echo "$OUTPUT" | grep -q "GO-2024-3218" && \
               echo "$OUTPUT" | grep -q "Fixed in: N/A"; then
              echo "Ignoring GO-2024-3218 (no upstream fix available)"
              exit 0
            fi
            exit $EXIT
          fi

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run go test
        run: CGO_ENABLED=0 go test -tags goolm,stdjson ./...

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Disable Windows Firewall for tests
        shell: powershell
        run: |
          # GitHub-hosted runners are ephemeral; disable the firewall so go test
          # binaries are not silently blocked when libp2p/mDNS bind to ports.
          netsh advfirewall set allprofiles state off

      - name: Run go build
        run: go build -tags goolm,stdjson ./...
        env:
          CGO_ENABLED: '0'

      - name: Run go test
        run: go test -tags goolm,stdjson ./...
        env:
          CGO_ENABLED: '0'

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build frontend for web backend
        run: make -C web build-frontend

      - name: Run web tests
        run: make -C web test

      - name: Check frontend formatting
        run: cd web/frontend && pnpm format

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  mesh-integration:
    name: Mesh Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and run mesh integration script
        run: bash ./scripts/integration-mesh.sh
        env:
          CGO_ENABLED: '0'

  cross-compile:
    name: Cross-compile core targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Cross-compile all Makefile-managed platforms
        run: CGO_ENABLED=0 make build-all

  cross-compile-android:
    name: Cross-compile Android bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          local-cache: true

      - name: Build universal Android bundle
        run: make build-android-bundle
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.android-ndk-path }}
          ANDROID_NDK_HOST: linux-x86_64
