name: build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  build:
    name: Build (Linux)
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build core binaries
        run: make build-all

      - name: Check binary size against baseline
        run: |
          bin=build/rhizome-linux-amd64
          actual=$(stat -c%s "$bin")
          baseline=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' scripts/binary-size-baseline.txt)
          if [ -z "$baseline" ]; then
            echo "::error::no baseline found in scripts/binary-size-baseline.txt"
            exit 1
          fi
          pct=$(( (actual - baseline) * 100 / baseline ))
          echo "rhizome-linux-amd64: ${actual} bytes (baseline ${baseline}, ${pct}%)"
          echo "module deps: $(go list -m all | wc -l)"
          if [ "$pct" -gt 30 ]; then
            echo "::error::binary size grew ${pct}% over baseline; bump scripts/binary-size-baseline.txt deliberately or drop the new weight"
            exit 1
          elif [ "$pct" -gt 15 ]; then
            echo "::warning::binary size grew ${pct}% over baseline"
          elif [ "$pct" -lt -10 ]; then
            echo "::warning::binary is ${pct#-}% under baseline; consider lowering scripts/binary-size-baseline.txt"
          fi

      - name: Upload core artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rhizome-core-all
          path: build/rhizome-*

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build Windows amd64 binary
        run: go build -tags goolm,stdjson -o rhizome-windows-amd64.exe ./cmd/rhizome

      - name: Build Windows i386 binary
        run: go build -tags goolm,stdjson -o rhizome-windows-386.exe ./cmd/rhizome
        env:
          GOARCH: '386'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rhizome-windows
          path: |
            rhizome-windows-amd64.exe
            rhizome-windows-386.exe

  build-android-bundle:
    name: Build Android universal bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          # Disable the local cache: a partially-extracted NDK entry breaks
          # the toolchain (missing bin/clang) and persists across runs.
          local-cache: false

      - name: Build universal Android bundle
        run: make build-android-bundle
        env:
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOST: linux-x86_64

      - name: Upload Android bundle
        uses: actions/upload-artifact@v7
        with:
          name: rhizome-android-universal
          path: build/rhizome-android-universal.zip

  mesh-integration:
    name: Mesh Integration
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and run mesh integration script
        run: bash ./scripts/integration-mesh.sh
        env:
          CGO_ENABLED: '0'

  swarm-integration:
    name: Swarm Integration
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build and run swarm integration script
        run: bash ./scripts/integration-swarm.sh
        env:
          CGO_ENABLED: '0'
