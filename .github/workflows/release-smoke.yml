name: release-smoke

# Weekly snapshot build across the full GoReleaser matrix so config rot or a
# per-arch compile break surfaces here instead of on release day. Publishes
# nothing: `goreleaser build` produces binaries only (dockers_v2 and the
# release itself are publish-phase), and the Android universal bundle hook is
# env-gated off so no NDK is required.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  snapshot:
    name: GoReleaser snapshot build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build all release targets (snapshot, no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Keep in lockstep with release.yml and nightly.yml.
          version: ~> v2.18
          args: build --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
