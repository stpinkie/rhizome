name: Labeler

# pull_request_target runs in the base repo's context so labels can be
# applied to forked PRs as well; the config it reads comes from the base
# branch, so PRs cannot alter their own labeling rules.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Path Labels
    runs-on: ubuntu-latest
    steps:
      - name: Apply path-based labels
        uses: actions/labeler@v6
        with:
          sync-labels: true
          dot: true # so `.github/**` globs match dotfiles
